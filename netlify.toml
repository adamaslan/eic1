# Netlify builds from the repo root. The web app is an npm workspace member, so
# install and build happen here and only the SPA output is published.
[build]
command = "npm run lint && npm run build --workspace web"
publish = "apps/web/build/client"

[build.environment]
NODE_VERSION = "24"

# Share relay: single-post shares published at the sender's explicit tap. The functions
# in netlify/functions serve /s/<id> (the readable preview page iMessage crawls and
# recipients open) and /api/share (publish/fetch/revoke) over the shared-posts blob
# store; each function declares its own route via its exported `config.path`.
[functions]
directory = "netlify/functions"

# Static responses only: Netlify does not apply these to the function responses above.
# The CSP deliberately restricts no script or style source: the SPA shell has inline scripts
# whose hashes change per build. Microphone stays allowed for the piano room.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Permissions-Policy = "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)"
    Strict-Transport-Security = "max-age=31536000"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
