# Netlify builds from the repo root. The web app is an npm workspace member, so
# install and build happen here and only the SPA output is published.
[build]
command = "npm run lint && npm run build --workspace web"
publish = "apps/web/build/client"

[build.environment]
NODE_VERSION = "24"

# Share relay: single-post shares published at the sender's explicit tap. The functions
# in netlify/functions serve /s/<id> (the readable preview page iMessage crawls and
# recipients open) and /api/share (publish/fetch/revoke) over the shared-posts blob
# store; each function declares its own route via its exported `config.path`.
[functions]
directory = "netlify/functions"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
