name: Credential scan
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  credential-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          mkdir -p /tmp/gitleaks-bin
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin gitleaks
      - name: Scan changed commits, redact findings
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"; head="$PUSH_HEAD"
          fi
          [[ "$base" =~ ^[0-9a-f]{40}$ && "$head" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git cat-file -e "${head}^{commit}"
          if [[ "$base" == 0000000000000000000000000000000000000000 ]]; then
            range="$head"
          else
            git cat-file -e "${base}^{commit}"
            range="$base..$head"
          fi
          # Rules and ignores come from the trusted base commit, never from the
          # head under test, so a change cannot allowlist its own secret.
          : > /tmp/gitleaks-empty-ignore
          args=(--redact=100 --no-banner --log-opts="$range" --gitleaks-ignore-path=/tmp/gitleaks-empty-ignore --ignore-gitleaks-allow)
          if [[ "$base" != 0000000000000000000000000000000000000000 ]] && git cat-file -e "${base}:.gitleaks.toml" 2>/dev/null; then
            git show "${base}:.gitleaks.toml" > /tmp/gitleaks-base.toml
            args+=(--config=/tmp/gitleaks-base.toml)
          else
            args+=(--config=/tmp/gitleaks-default.toml)
            printf '[extend]\nuseDefault = true\n' > /tmp/gitleaks-default.toml
          fi
          # Scan a bare copy: gitleaks also reads .gitleaksignore from the scanned
          # source directory, and a bare repo has no working tree file to honor.
          git clone --quiet --bare --no-local . /tmp/gitleaks-scan.git
          /tmp/gitleaks-bin/gitleaks git "${args[@]}" /tmp/gitleaks-scan.git
