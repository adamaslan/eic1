name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: eslint - rules-of-hooks is an error
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck --workspace web

  unit:
    name: vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test

  transition-smoke:
    name: playwright transition smoke - netlify deploy preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      # The deploy preview serves the PR HEAD build, never the merge ref. Specs must
      # come from the same commit Netlify built, or any spec added on main after the
      # branch point waits for UI the preview cannot serve (90s timeout class seen on
      # PR #58: main's music/profile-studio specs vs a pre-music branch preview).
      # lint/tsc/vitest keep the merge-ref default - they test the merged result; the
      # post-publish prod gate covers the integrated result after every merge.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for the Netlify deploy preview of this commit
        id: preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--everybodyiscool.netlify.app
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          want="${HEAD_SHA:0:7}"
          echo "url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          # Only the served build's own footer stamp proves WHAT the preview serves.
          # A bare 200 can be a previous branch build (the PR #58/#71 wrong-commit
          # smoke class), and even Netlify's deploy-preview commit status can flip
          # before the URL serves the new build, so status is diagnostic-only here.
          # The stamp is client-rendered from the COMMIT_REF Vite define; chromium is
          # already installed above. A missing status never fails this step when the
          # stamp is correct, and a green status never passes it while the stamp lags.
          for i in $(seq 1 90); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/status" --jq '[.statuses[] | select(.context == "netlify/everybodyiscool/deploy-preview") | .state] | first // ""' 2>/dev/null || echo "")
            stamp=$(node e2e/preview-stamp.mjs "$want" 2>/dev/null || true)
            if [ "$stamp" = "$want" ]; then
              echo "Served footer stamp $stamp == head $want (provider status: '$state')"
              exit 0
            fi
            echo "[$i/90] served_stamp='$stamp' status='$state' - waiting for $want"
            sleep 10
          done
          echo "Deploy preview never verifiably served the build of $HEAD_SHA" >&2
          exit 1
      - name: Run transition smoke against the deploy preview
        run: npx playwright test
        env:
          DEPLOY_PREVIEW_URL: ${{ steps.preview.outputs.url }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
