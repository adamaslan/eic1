name: CI

on:
  workflow_dispatch:
    inputs:
      run_local_suites:
        description: "Run optional duplicate local test suites"
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Relevant tests and real app build run locally before publication.
    if: github.event_name == 'workflow_dispatch' && inputs.run_local_suites
    name: eslint - rules-of-hooks is an error
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint

  typecheck:
    # Relevant tests and real app build run locally before publication.
    if: github.event_name == 'workflow_dispatch' && inputs.run_local_suites
    name: tsc --noEmit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck --workspace web

  unit:
    # Relevant tests and real app build run locally before publication.
    if: github.event_name == 'workflow_dispatch' && inputs.run_local_suites
    name: vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test

  transition-smoke:
    name: playwright transition smoke - netlify deploy preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      # The deploy preview serves the PR HEAD build, never the merge ref. Specs must
      # come from the same commit Netlify built, or any spec added on main after the
      # branch point waits for UI the preview cannot serve (timeout class seen on
      # PR #58: main's music/profile-studio specs vs a pre-music branch preview).
      # lint/tsc/vitest keep the merge-ref default - they test the merged result; the
      # post-publish prod gate covers the integrated result after every merge.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Assert smoke checkout is the PR head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node e2e/ci-preview.mjs assert-head
      - run: npm ci
      - name: Test transition-smoke safety guards
        run: node --test e2e/ci-preview.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Wait for the Netlify deploy preview of this commit
        id: preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: https://deploy-preview-${{ github.event.pull_request.number }}--everybodyiscool.netlify.app
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node e2e/ci-preview.mjs wait
      - name: Run transition smoke against the deploy preview
        run: npx playwright test
        env:
          DEPLOY_PREVIEW_URL: ${{ steps.preview.outputs.url }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
